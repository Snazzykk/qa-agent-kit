# =============================================================================
# project.yml — анкета проекта для qa-agent-kit
# =============================================================================
# Как читать пометки:
#   [ОБЯЗАТЕЛЬНО]  без этого этап не запустится
#   [ЖЕЛАТЕЛЬНО]   работает и без этого, но результат будет хуже
#   [МОЖНО ПУСТО]  пусто = агент разберётся сам (написано, как именно)
#   КОГДА          на каком этапе поле начинает использоваться
#
# Секреты (пароли, токены, ключи) сюда НЕ писать. Только их имена.
# Пустое поле оставляйте пустым (или удалите строку), заглушки вроде "TODO" не нужны.
# =============================================================================

name: my-project            # [ОБЯЗАТЕЛЬНО] короткое имя проекта, любое. Идёт в заголовки отчётов.


# -----------------------------------------------------------------------------
# dev_repo — репозиторий РАЗРАБОТЧИКОВ (то, что мы тестируем)
# -----------------------------------------------------------------------------
# [ОБЯЗАТЕЛЬНО ОДНО ИЗ: dev_repo ИЛИ sources ИЛИ requirements]  КОГДА: /audit
# Если доступа к коду разработки нет, оставьте dev_repo пустым, но тогда ниже ДОЛЖЕН быть заполнен
# хотя бы один источник (sources.* или requirements.*). Иначе /audit остановится и спросит,
# чем ему руководствоваться: анализировать будет нечего.
# Агент читает этот код, но НИЧЕГО в нём не меняет (только чтение).
# Если dev_repo заполнен, нужно указать ОДИН из двух вариантов: url ИЛИ path.
#
# Вариант 1: у вас есть только ссылка на git. Скрипт сам склонирует репо
#            в служебную папку .qa-kit/dev/ внутри QA-репо (в git не попадёт).
#            Нужен доступ к репо: ваш SSH-ключ или токен, уже настроенный в git.
# Вариант 2: репо уже лежит у вас на диске. Укажите путь к его корню.
dev_repo:
  url:                      # формат: git@github.com:company/backend.git  или  https://github.com/company/backend.git
  branch:                   # [ЖЕЛАТЕЛЬНО] какую ветку тестируем, формат: develop. Пусто = ветка по умолчанию.
  path:                     # формат: C:\work\payments-backend  (если задан, url не нужен)
  # Для сервисов в монорепо укажите подпапку, чтобы индекс был быстрым и точным:
  subdir:                   # [МОЖНО ПУСТО] формат: services/billing   Пусто = весь репозиторий.
  full_history: false       # true = клонировать с историей (нужно для оценки риска по частоте
                            #        изменений за 90 дней, но дольше). false = быстрый клон без истории.


# -----------------------------------------------------------------------------
# sources — источники правды, если кода разработки нет (или в дополнение к коду)
# -----------------------------------------------------------------------------
# [ЖЕЛАТЕЛЬНО; ОБЯЗАТЕЛЬНО, если dev_repo пуст и requirements тоже пуст]  КОГДА: /audit
# Без кода агент строит картину продукта по этим источникам. Они менее надёжны, чем код
# (спецификация может устареть), поэтому каждый вывод в отчёте помечается источником и уровнем
# уверенности. Чем больше источников указано, тем точнее результат. Всё необязательно по отдельности.
sources:
  api_spec:                 # OpenAPI/Swagger. Формат: ссылка (https://stage.example.com/openapi.json)
                            #                    или путь к файлу (.qa-kit/context/openapi.yaml)
  collections: []           # Postman/Insomnia-выгрузки. Формат списка:  - .qa-kit/context/payments.postman.json
                            #                                            - docs/Insomnia_2026.json
  har: []                   # HAR-записи из браузера (DevTools -> Network -> Save all as HAR).
                            # Формат списка:  - .qa-kit/context/checkout.har
  stand:                    # Живой стенд, чтобы смотреть реальные ответы и UI.
    url:                    # формат: https://stage.example.com
    reachable_from_here: unknown   # yes / no / unknown: открывается ли стенд с этой машины.
                                   # no = по стенду ничего не проверяем, только по файлам выше.


# -----------------------------------------------------------------------------
# stack — стек ДЛЯ НОВЫХ ТЕСТОВ
# -----------------------------------------------------------------------------
# [МОЖНО ПУСТО]  КОГДА: /audit (разведка), /gen
# Если известно, заполните. Если НЕ знаете или тесты уже написаны,
# оставьте пустым: /audit сам определит
#   1) стек тестируемого продукта по его коду (FastAPI, Django, Express и т.д.),
#   2) стек и стиль ваших существующих тестов (библиотеки, фикстуры, базовые классы),
#      и запишет это в artifacts/qa-profile.json.
# Заполняйте только чтобы ПЕРЕОПРЕДЕЛИТЬ определённое автоматически,
# например «для новых тестов брать Playwright, хотя в репо сейчас только API».
stack:
  api:                      # пример: httpx + pytest      Пусто = как в существующих тестах
  ui:                       # пример: playwright          Пусто = как в существующих тестах
  report:                   # пример: allure              Пусто = как в существующих тестах


# -----------------------------------------------------------------------------
# existing_tests — как вести себя, если в QA-репо тесты уже есть
# -----------------------------------------------------------------------------
# КОГДА: /audit (разведка QA-репо) и /gen
# Главное правило: новые тесты НЕ должны отличаться от готовых.
# Агент читает существующие тесты, берёт из них нейминг, структуру папок,
# базовые классы, фикстуры, оформление шагов и отчётов, и пишет так же.
# Свои классы и фикстуры не создаёт, пока в репо нет подходящих.
existing_tests:
  follow_style: true        # true = писать как в готовых тестах (рекомендуется).
                            # false = только по conventions и stack ниже.
  reference_tests:          # [ЖЕЛАТЕЛЬНО] 1-3 тестовых файла, которые считаете образцом.
    []                      # формат списка:  - tests/api/test_orders.py
                            # Пусто = агент выберет образцы сам и покажет, какие выбрал.


# -----------------------------------------------------------------------------
# requirements — откуда брать «что должно быть» (ТЗ, требования, истории)
# -----------------------------------------------------------------------------
# [ЖЕЛАТЕЛЬНО]  КОГДА: /reconcile (сверка кода и ТЗ). Для /audit не нужно.
# Если пусто, /reconcile честно скажет «сверять не с чем», и план будет только по коду.
# ГДЕ ХРАНИТЬ ФАЙЛЫ С КОНТЕКСТОМ (ТЗ, спецификации, коллекции, HAR): в папке .qa-kit/context/
# QA-репозитория. Она создаётся скриптом подключения и исключена из git, поэтому документы
# проекта случайно не уйдут в коммит. В других папках (например docs/) они были бы видны git.
# Можно указать несколько источников сразу, они объединяются.
requirements:
  # Источник 1: файлы и папки (самое простое и надёжное).
  # Формат: пути к папкам или файлам (.md, .txt, .pdf, .docx, .csv, .json).
  files: []                 # пример:  - .qa-kit/context/requirements/
                            #          - .qa-kit/context/specs/payments.md

  # Источник 2: MCP (Confluence, Jira и т.п.).
  # MCP сам по себе здесь НЕ подключается: сервер описывается в .mcp.json (см. блок mcp ниже).
  # Здесь вы лишь говорите, КАКИЕ страницы/задачи читать через уже подключённый MCP.
  confluence: []            # формат:  - space: QA   page: "Платежи / Требования"
                            #          - url: https://company.atlassian.net/wiki/spaces/QA/pages/12345
  jira: []                  # формат:  - project: PAY   jql: "project = PAY AND fixVersion = 2.5"
                            #          - issue: PAY-1234

  # Устные договорённости, которых нет в документах: короткие тезисы текстом.
  notes: []                 # пример:  - "Возврат возможен только в течение 14 дней"
                            #          - "Роль manager не видит отчёты по другим отделам"


# -----------------------------------------------------------------------------
# mcp — какие MCP-серверы подключить (Confluence, Jira и т.д.)
# -----------------------------------------------------------------------------
# [МОЖНО ПУСТО]  КОГДА: setup (при подключении проекта), нужен до /reconcile
# Скрипт подключения запишет эти серверы в .mcp.json QA-репо (если файла нет;
# существующий .mcp.json не перезаписывается, а только показывается, что добавить).
# Здесь пишется ТОЛЬКО какой сервер и какие переменные окружения ему нужны (по именам).
# Сами токены лежат в переменных окружения или в .env, но не в этом файле.
mcp:
  servers: []               # формат:  - name: atlassian
                            #            command: npx
                            #            args: ["-y", "<пакет MCP-сервера из документации вашей компании>"]
                            #            env_vars: [ATLASSIAN_URL, ATLASSIAN_TOKEN]   # только имена!
                            # Какой именно MCP использует ваша компания для Confluence/Jira,
                            # уточните у админов или в документации: это зависит от облака или on-prem.


# -----------------------------------------------------------------------------
# conventions — правила команды по написанию тестов
# -----------------------------------------------------------------------------
# [ЖЕЛАТЕЛЬНО]  КОГДА: /gen (при генерации тестов). Для /audit и /plan не нужно.
# Формат: путь к текстовому файлу (Markdown) с правилами. Файл можно писать позже
# и дополнять по ходу работы; сам файл условий не имеет, достаточно обычных списков.
# Что обычно описывают:
#   - нейминг тестов и файлов, где что лежит
#   - как оформлять шаги и отчёты (Allure, маркеры, теги)
#   - как работать с тестовыми данными и фикстурами
#   - что запрещено (например sleep, хардкод токенов)
#   - как проверять ответы API (схемы, коды, тексты ошибок)
# Если файла нет: правила берутся из существующих тестов (см. existing_tests),
# а если тестов тоже нет, действуют общие правила из CLAUDE.md комплекта.
# При конфликте приоритет такой: conventions > существующий стиль > правила по умолчанию.
conventions:
  file:                     # формат: docs/team-test-rules.md
  inline: []                # короткие правила прямо здесь, если отдельный файл не нужен
                            # формат:  - "Имена тестов: test_<что>_<условие>_<результат>"
                            #          - "Никаких time.sleep, только явные ожидания"


# -----------------------------------------------------------------------------
# env — окружение, на котором будут запускаться тесты
# -----------------------------------------------------------------------------
# [МОЖНО ПУСТО]  КОГДА: прогон после /gen. Для /audit, /reconcile, /plan не нужно.
# Без этого тесты можно НАПИСАТЬ, но не ЗАПУСТИТЬ (агент так и скажет).
# СЕКРЕТЫ СЮДА НЕ ПИСАТЬ: токены, пароли и ключи хранятся в .env или в переменных
# окружения вашей машины. Здесь только адреса и ИМЕНА переменных.
env:
  base_url:                 # формат: https://stage.example.com
  required_vars: []         # формат (только имена):  - API_TOKEN
                            #                         - DB_URL
  run_command:              # [МОЖНО ПУСТО] как запускать тесты. Пусто = агент найдёт по pytest.ini / Makefile.
                            # пример: pytest tests/api -m smoke --alluredir=allure-results
  reachable_from_here: unknown   # yes / no / unknown: доступен ли стенд с этой машины.
                                 # no = тесты только пишем, не запускаем (например, закрытая VDI).
