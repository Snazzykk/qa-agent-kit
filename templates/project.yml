# =============================================================================
# project.yml — анкета проекта (qa-agent-kit)
# =============================================================================
# Заполняется за пару минут. Нужны только БЛОКИ 1-4 ниже. Остальное (в конце файла) закомментировано:
# раскомментируйте, если понадобится.
#
# Правила:
#   - Пустое поле оставляйте пустым. Заглушки вроде "TODO" не нужны: агент спросит, чего не хватает.
#   - Секреты (пароли, токены, ключи) сюда НЕ писать, только имена переменных.
#   - Файлы с контекстом (ТЗ, спецификации, коллекции, HAR) кладите в папку .qa-kit/context/ этого
#     репозитория: она исключена из git, документы случайно не уйдут в коммит.
#
# Что заполнять в вашей ситуации:
#   +-----------------------------------------+------------------------------------------------+
#   | Ситуация                                | Заполните                                      |
#   +-----------------------------------------+------------------------------------------------+
#   | Есть код разработки                     | БЛОК 2: dev_repo (url ИЛИ path)                |
#   | Кода нет, есть Swagger / стенд          | БЛОК 2: sources (api_spec и/или stand.url)     |
#   | Кода нет, есть только ТЗ                | БЛОК 2: requirements (files и/или notes)       |
#   | Нужно запускать тесты                   | БЛОК 3: env (base_url, run_command)            |
#   | Ничего из БЛОКА 2 нет                   | Агент остановится и спросит, чем руководствоваться |
#   +-----------------------------------------+------------------------------------------------+
# =============================================================================


# -----------------------------------------------------------------------------
# БЛОК 1. Имя проекта                                          [обязательно]
# -----------------------------------------------------------------------------
name: my-project            # любое короткое имя, идёт в заголовки отчётов


# -----------------------------------------------------------------------------
# БЛОК 2. Откуда агент узнаёт, как устроен продукт      [нужен хотя бы один пункт]
# -----------------------------------------------------------------------------
# Читать можно в любом сочетании. Чем больше источников, тем точнее результат.
# Без кода вывод строится по спецификации/стенду/ТЗ и помечается уровнем уверенности.

# 2а. Репозиторий разработчиков. Агент только читает, ничего в нём не меняет.
#     Укажите ОДНО из двух. Пусто = кода разработки нет (тогда нужен 2б или 2в).
dev_repo:
  url:                      # есть только ссылка. Формат: git@github.com:company/backend.git
                            # или https://github.com/company/backend.git
                            # Склонируется в .qa-kit/dev/ (в git не попадёт). Нужен ваш SSH-ключ/токен в git.
  path:                     # репо уже лежит на диске. Формат: C:\work\payments-backend

# 2б. Спецификация и стенд (если кода нет или в дополнение к нему)
sources:
  api_spec:                 # OpenAPI/Swagger: ссылка (https://stage.example.com/openapi.json)
                            # или файл (.qa-kit/context/openapi.yaml)
  stand_url:                # живой стенд, чтобы смотреть реальные ответы. Формат: https://stage.example.com
                            # Только безопасное чтение. Прод не указывать.

# 2в. Требования (ТЗ, истории). Нужны для сверки продукта с требованиями в /plan и для /feature.
requirements:
  files: []                 # файлы или папки с ТЗ (.md .txt .pdf .docx .csv .json). Формат списка:
                            #   - .qa-kit/context/requirements/
                            #   - .qa-kit/context/specs/payments.md
  notes: []                 # устные договорённости, которых нет в документах. Формат списка:
                            #   - "Возврат возможен только в течение 14 дней"
                            #   - "Роль manager не видит отчёты других отделов"
  # Confluence и Jira: см. раздел «ДОПОЛНИТЕЛЬНО» внизу. Проще всего ссылкой в features/<имя>/brief.md.


# -----------------------------------------------------------------------------
# БЛОК 3. Запуск тестов                                      [можно пустым]
# -----------------------------------------------------------------------------
# Пусто = тесты можно написать, но нельзя запустить (агент так и скажет).
# Против боевого окружения (prod) агент тесты не запускает.
env:
  base_url:                 # стенд, на котором гонять тесты. Формат: https://stage.example.com
  run_command:              # как запускать. Пусто = агент найдёт по pytest.ini/Makefile.
                            # Пример: pytest tests/api -m smoke --alluredir=allure-results


# -----------------------------------------------------------------------------
# БЛОК 4. Как писать тесты                                   [можно пустым]
# -----------------------------------------------------------------------------
# Если в репо уже есть тесты, новые пишутся В ТОМ ЖЕ СТИЛЕ (нейминг, структура, базовые классы,
# фикстуры): агент берёт его из существующих тестов, ничего заполнять не нужно.
# Добавьте правила команды сюда, только если они есть и их нет в самих тестах.
# Приоритет при конфликте: эти правила > стиль существующих тестов > шаблоны скиллов.
rules: []                   # короткие правила списком. Формат:
                            #   - "Имена тестов: test_<что>_<условие>_<результат>"
                            #   - "Никаких time.sleep, только явные ожидания"
                            # Длинные правила положите в файл и укажите его тут:
                            #   - "см. docs/team-test-rules.md"


# =============================================================================
# ДОПОЛНИТЕЛЬНО (раскомментируйте нужное)
# =============================================================================
# Все эти поля необязательны. Пусто или отсутствует = агент действует по умолчанию, указанному в строке.

